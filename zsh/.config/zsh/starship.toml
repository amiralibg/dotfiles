"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 5000

format = "$directory$os$git_branch$git_status$nodejs$rust$golang$php $character"

[os]
disabled = false
format = "[$symbol](#blue) "

[os.symbols]
Ubuntu  = "󰕈"
Artix   = "󰣇"
Arch    = "󰣇"
CachyOS = "󰣇"
Macos   = ""

[directory]
format            = "[$path](cyan) "
truncation_length = 4
truncate_to_repo  = true

[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$renamed$deleted$stashed$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[staged:+$count ](bold green)"
modified   = "[changed:●$count ](bold yellow)"
untracked  = "[untracked:?$count ](bold white)"
renamed    = "[renamed:»$count ](bold yellow)"
deleted    = "[deleted:✘$count ](bold red)"
stashed    = "[stashed:\\$$count ](bold blue)"
conflicted = "[conflicts:⚡$count ](bold red)"


[nodejs]
symbol = ""
format = "[$symbol $version](green) "

[rust]
symbol = ""
format = "[$symbol $version](red) "

[golang]
symbol = ""
format = "[$symbol $version](cyan) "

[php]
symbol = ""
format = "[$symbol $version](purple) "

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"
